# ============================================================================
# AniChin — Docker Compose (Staging)
# Lightweight setup — no caddy, no backup-cron, no PG tuning
# Use for testing deploy before going to production
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=anichin_staging
      # Role migrasi/owner (hak DDL) — hanya dipakai service `migrate`.
      - POSTGRES_USER=anichin_staging
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (jangan pakai default yang bisa ditebak)}
      # F-16: role aplikasi (DML saja) untuk service `web`.
      - POSTGRES_APP_USER=anichin_staging_app
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only)}
    ports:
      - "127.0.0.1:5433:5432"  # Different port from prod
    volumes:
      - staging_db_data:/var/lib/postgresql/data
      # F-16: sama seperti prod — pembuat role aplikasi.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichin_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      # Build the `migrate` stage: it has bun + the Prisma CLI/engines.
      # (The runtime stage has no `bunx`, so the old command always failed.)
      target: migrate
      args:
        DATABASE_PROVIDER: postgresql
    # Sama seperti prod: `docker compose pull` hanya menarik service yang punya
    # nama image, dan rollback bekerja dengan menandai ulang tag ini.
    image: ${ANICHIN_MIGRATE_IMAGE:-anichin/anichin:staging-migrate}
    restart: "no"
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      - NODE_ENV=production
      # F-16: role migrasi (owner) — butuh DDL.
      - DATABASE_URL=postgresql://anichin_staging:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/anichin_staging?schema=public
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # db-roles — pastikan role aplikasi (DML saja) ada & sinkron (F-16)
  # Dijalankan setiap `up` dan idempoten. Diperlukan karena skrip initdb
  # di entrypoint postgres hanya jalan pada VOLUME YANG MASIH KOSONG:
  # database yang sudah ada (hasil deploy sebelum pemisahan role) tidak akan
  # punya role aplikasi, dan tanpa langkah ini `web` akan gagal konek.
  # Urutannya setelah `migrate` supaya tabel baru sekaligus tercakup GRANT
  # eksplisit (selain ALTER DEFAULT PRIVILEGES).
  # ─────────────────────────────────────────────────────────────
  db-roles:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - PGHOST=db
      - PGPORT=5432
      - POSTGRES_DB=anichin_staging
      - POSTGRES_USER=anichin_staging
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_APP_USER=anichin_staging_app
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only)}
    entrypoint: ["sh", "/docker-entrypoint-initdb.d/10-app-role.sh"]
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DATABASE_PROVIDER: postgresql
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_BUILD_ID: ${NEXT_PUBLIC_BUILD_ID:-}
    image: ${ANICHIN_IMAGE:-anichin/anichin:staging-current}
    restart: unless-stopped
    ports:
      # 3001 di host (bukan 3000) — health check dari luar container harus
      # memakai 3001; healthcheck di dalam compose tetap 3000 (localhost container).
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      # F-16: aplikasi memakai role DML-only, bukan role owner.
      - DATABASE_URL=postgresql://anichin_staging_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only)}@db:5432/anichin_staging?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required (staging juga memakai cookie/JWT bertanda tangan)}
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # F-16: role aplikasi wajib ada sebelum web start.
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  staging_db_data:
    driver: local

networks:
  default:
    name: anichin-staging-network
