# ============================================================================
# AniChin — Docker Compose (Production)
# Services: web + db (PostgreSQL 16) + redis + migrate + db-roles + backup-cron + caddy
#
# F-16 — dua role database, dua kredensial:
#   migrate/backup-cron → `anichin`      (owner, hak DDL)  → POSTGRES_PASSWORD
#   web                 → `anichin_app`  (DML saja)        → POSTGRES_APP_PASSWORD
#
# Dua cara menjalankan (keduanya memakai tag image yang sama):
#   A. Server dengan source repo (build lokal):
#        cp .env.example .env      # isi nilai asli
#        docker compose -f docker-compose.prod.yml up -d --build
# Nama kontainer sengaja TIDAK di-pin (`container_name`) supaya
# `docker compose up -d --scale web=3` bisa jalan — container_name membuat
# replika kedua gagal dengan "container name is already in use". Gunakan
# `docker compose -f docker-compose.prod.yml logs -f web` dsb. untuk operasi.
#
#   B. Server tanpa source repo (image hasil CI dari registry):
#        docker compose -f docker-compose.prod.yml pull
#        docker compose -f docker-compose.prod.yml up -d
#      `web`   → ${ANICHIN_IMAGE:-anichin/anichin:prod-current}
#      `migrate` → ${ANICHIN_MIGRATE_IMAGE:-anichin/anichin:prod-migrate}
#
# Deploy Production (.github/workflows/deploy.yml) memakai jalur B dan
# menyiapkan file yang dibutuhkan di /opt/anichin-<environment>.
# ============================================================================

services:
  # Reject missing, placeholder, or low-diversity production secrets before
  # any database/service is started. The app repeats validation at runtime.
  env-check:
    image: alpine:3.22
    restart: "no"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY is required}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required for email verification}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required for email verification}
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS is required for email verification}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        fail() { echo "ERROR: $1" >&2; exit 1; }
        check_secret() {
          name="$1"; value="$2"; minimum="$3"
          [ "${#value}" -ge "$minimum" ] || fail "$name must be at least $minimum characters"
          lower=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
          case "$lower" in
            change-me*|replace-with*|your-*|example*|password*|secret123|*change-in-production*) fail "$name is a placeholder/weak value" ;;
          esac
          unique=$(printf '%s' "$value" | fold -w1 | sort -u | wc -l | tr -d ' ')
          [ "$unique" -ge 8 ] || fail "$name has insufficient character diversity"
        }
        check_secret POSTGRES_PASSWORD "$POSTGRES_PASSWORD" 32
        check_secret POSTGRES_APP_PASSWORD "$POSTGRES_APP_PASSWORD" 32
        check_secret NEXTAUTH_SECRET "$NEXTAUTH_SECRET" 32
        check_secret TWO_FACTOR_ENCRYPTION_KEY "$TWO_FACTOR_ENCRYPTION_KEY" 64
        check_secret SMTP_PASS "$SMTP_PASS" 16
        [ "$POSTGRES_PASSWORD" != "$POSTGRES_APP_PASSWORD" ] || fail "database owner and app passwords must differ"
        case "$NEXTAUTH_URL" in https://*) ;; *) fail "NEXTAUTH_URL must use HTTPS" ;; esac
        url_rest=${NEXTAUTH_URL#https://}
        url_authority=${url_rest%%/*}
        case "$url_authority" in *@*) fail "NEXTAUTH_URL must not contain credentials" ;; esac
        case "$url_rest" in *\?*|*\#*) fail "NEXTAUTH_URL must not contain a query or fragment" ;; esac
        url_path=${url_rest#*/}
        [ "$url_path" = "$url_rest" ] || [ -z "$url_path" ] || fail "NEXTAUTH_URL must be an origin without a path"
        case "$url_authority" in
          \[*\]*) url_host=${url_authority#\[}; url_host=${url_host%%\]*} ;;
          *:*) url_host=${url_authority%%:*} ;;
          *) url_host=$url_authority ;;
        esac
        lower_host=$(printf '%s' "$url_host" | tr '[:upper:]' '[:lower:]')
        case "$lower_host" in
          ''|localhost|*.localhost|127.*|0.*|::|::1|::ffff:127.*|::ffff:7f??:*|::ffff:0.*|::ffff:0:0|::127.*|::7f??:*|example|example.com|example.net|example.org|*.example|*.test|*.invalid|*.example.com|*.example.net|*.example.org)
            fail "NEXTAUTH_URL must use a real public host, not a placeholder/loopback" ;;
        esac
        [ "${#TWO_FACTOR_ENCRYPTION_KEY}" -eq 64 ] || fail "TWO_FACTOR_ENCRYPTION_KEY must be 64 hex characters"
        case "$TWO_FACTOR_ENCRYPTION_KEY" in *[!0-9a-fA-F]*) fail "TWO_FACTOR_ENCRYPTION_KEY must be hexadecimal" ;; esac
        echo "Production secret configuration validated."

  # ─────────────────────────────────────────────────────────────
  # db — PostgreSQL 16 with tuning for production
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      env-check:
        condition: service_completed_successfully
    environment:
      - POSTGRES_DB=anichin
      # Role MIGRASI/owner: pemilik database, punya hak DDL. Dipakai hanya oleh
      # service `migrate` (prisma migrate deploy) dan `backup-cron` (pg_dump).
      - POSTGRES_USER=anichin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # F-16: role APLIKASI (DML saja) untuk service `web` — bug di aplikasi
      # tidak lagi bisa DROP/ALTER/TRUNCATE tabel. Dibuat oleh
      # scripts/postgres-init/10-app-role.sh.
      - POSTGRES_APP_USER=anichin_app
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only; generate: openssl rand -hex 32)}
      # Performance tuning (adjust based on host RAM)
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C.UTF-8
    # Catatan: WAL archiving (`wal_level=replica` + `archive_mode=on` +
    # `archive_command` ke bind mount ./backups/wal) DIHAPUS. Direktori bind
    # mount dibuat Docker sebagai root, sedangkan PostgreSQL berjalan sebagai
    # uid 70 — `archive_command` selalu gagal, dan saat archive_mode aktif
    # PostgreSQL menahan WAL di pg_wal sampai berhasil diarsipkan. Artinya
    # disk host bisa penuh lalu database berhenti menerima tulisan. Tidak ada
    # skrip mana pun di repo ini yang membaca arsip WAL tersebut (restore
    # memakai pg_restore dari dump di ./backups), jadi arsip itu murni risiko.
    # Backup resmi: service `backup-cron` (pg_dump harian, retensi 14 hari).
    command:
      - "postgres"
      - "-c" 
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    ports:
      - "127.0.0.1:5432:5432"  # Only bind to localhost — never expose publicly
    volumes:
      - db_data:/var/lib/postgresql/data
      # F-16: pembuat role aplikasi. Entrypoint postgres menjalankannya otomatis
      # saat data dir masih kosong; untuk DB yang sudah ada,
      # scripts/compose-deploy.sh memanggilnya lewat `docker compose exec`
      # (idempoten) sebelum stack di-up.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichin -d anichin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────
  # redis — rate limiting + session store + login lockout
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    ports:
      - "127.0.0.1:6379:6379"  # Local only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # migrate — one-shot init: applies Prisma migrations to PostgreSQL
  # Runs once on startup, then web service starts
  # ─────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      # Build the `migrate` stage: it has bun + the Prisma CLI/engines.
      # (The runtime stage has no `bunx`, so the old command always failed.)
      target: migrate
      args:
        DATABASE_PROVIDER: postgresql
    # Image yang dipakai/di-pull. Nama eksplisit ini penting:
    #  • `docker compose pull` hanya menarik image yang punya nama — sebelumnya
    #    service ini murni `build:`, jadi pull tidak menarik apa pun.
    #  • `docker build --target migrate -t <nama>` dari CI memakai tag yang sama,
    #    sehingga server tanpa source repo tetap bisa menjalankan migrasi.
    image: ${ANICHIN_MIGRATE_IMAGE:-anichin/anichin:prod-migrate}
    restart: "no"
    command: ["bunx", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # F-16: role migrasi (owner) — butuh DDL untuk membuat/mengubah tabel.
      # Kredensial ini TIDAK dipakai service `web`.
      - DATABASE_URL=postgresql://anichin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/anichin?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anichin-network

  # ─────────────────────────────────────────────────────────────
  # db-roles — pastikan role aplikasi (DML saja) ada & sinkron (F-16)
  # Dijalankan setiap `up` dan idempoten. Diperlukan karena skrip initdb
  # di entrypoint postgres hanya jalan pada VOLUME YANG MASIH KOSONG:
  # database yang sudah ada (hasil deploy sebelum pemisahan role) tidak akan
  # punya role aplikasi, dan tanpa langkah ini `web` akan gagal konek.
  # Urutannya setelah `migrate` supaya tabel baru sekaligus tercakup GRANT
  # eksplisit (selain ALTER DEFAULT PRIVILEGES).
  # ─────────────────────────────────────────────────────────────
  db-roles:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - PGHOST=db
      - PGPORT=5432
      - POSTGRES_DB=anichin
      - POSTGRES_USER=anichin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_APP_USER=anichin_app
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only)}
    entrypoint: ["sh", "/docker-entrypoint-initdb.d/10-app-role.sh"]
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - anichin-network


  # ─────────────────────────────────────────────────────────────
  # web — Next.js 16 standalone production server
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DATABASE_PROVIDER: postgresql
        # NEXT_PUBLIC_* di-inline saat build (tidak bisa ditimpa runtime).
        # Boleh dikosongkan: src/lib/site.ts jatuh ke NEXTAUTH_URL (server) /
        # DEFAULT_SITE_URL (bundle browser). Isi bila domain publik berbeda
        # dari NEXTAUTH_URL, mis. deploy di domain lain.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        # Versi cache service worker; kosong = fallback timestamp build.
        NEXT_PUBLIC_BUILD_ID: ${NEXT_PUBLIC_BUILD_ID:-}
    # Sama seperti `migrate`: nama image eksplisit supaya (1) `docker compose
    # pull` benar-benar menarik image hasil build CI, (2) `docker tag <rollback>
    # prod-current` yang dilakukan pipeline rollback benar-benar berpengaruh.
    image: ${ANICHIN_IMAGE:-anichin/anichin:prod-current}
    restart: unless-stopped
    # Beri waktu request berjalan selesai (SIGTERM → drain) saat redeploy.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"  # Local only — caddy handles public TLS
    # Do not mount all of .env here: it contains the database owner password.
    # The web process gets only its DML-only DB URL and the runtime settings it
    # needs (least privilege; migrations and backups retain owner credentials).
    environment:
      - NODE_ENV=production
      # F-16: aplikasi memakai role DML-only (bukan owner DB). Tanpa
      # POSTGRES_APP_PASSWORD compose menolak start — sengaja, supaya deployment
      # tidak diam-diam kembali memakai role owner.
      - DATABASE_URL=postgresql://anichin_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (role aplikasi DML-only)}@db:5432/anichin?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY is required}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required for email verification}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required for email verification}
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS is required for email verification}
      - "SMTP_FROM=${SMTP_FROM:-AniChin <no-reply@anichin.id>}"
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - NEXT_PUBLIC_DEBUG_OAUTH=${NEXT_PUBLIC_DEBUG_OAUTH:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      - NEXT_PUBLIC_IMAGE_HOSTS=${NEXT_PUBLIC_IMAGE_HOSTS:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_RELEASE=${NEXT_PUBLIC_SENTRY_RELEASE:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_DEBUG=${SENTRY_DEBUG:-false}
      - IP_HASH_SALT=${IP_HASH_SALT:-}
      - SESSION_REVALIDATE_SECONDS=${SESSION_REVALIDATE_SECONDS:-60}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_MEMORY_MB=${MAX_MEMORY_MB:-3072}
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # F-16: `web` hanya start setelah role aplikasi dipastikan ada.
      db-roles:
        condition: service_completed_successfully
    volumes:
      # Named volume, BUKAN bind mount ./logs:/app/logs: bind mount mewarisi
      # kepemilikan direktori host (root), sedangkan proses berjalan sebagai
      # uid 1001 — audit-log gagal menulis secara diam-diam (`catch {}` di
      # src/lib/audit-log.ts). Volume baru diinisialisasi dari isi image,
      # jadi /app/logs tetap milik nextjs:nodejs.
      # Baca log: docker compose -f docker-compose.prod.yml exec web \
      #             tail -f /app/logs/audit.jsonl
      - logs_data:/app/logs
    networks:
      - anichin-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ─────────────────────────────────────────────────────────────
  # backup-cron — daily PostgreSQL backups at 02:00
  # Retention: 14 days
  # ─────────────────────────────────────────────────────────────
  backup-cron:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - PGHOST=db
      # F-16: pg_dump harus bisa membaca SEMUA objek, jadi tetap role owner —
      # bukan role aplikasi DML-only.
      - PGUSER=anichin
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGDATABASE=anichin
      - BACKUP_RETENTION_DAYS=14
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /backups
        # Run initial backup on startup
        /usr/local/bin/backup.sh || true
        # Schedule daily backup at 02:00
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup.sh:ro
      # restore-db.sh juga di-mount: prosedur restore di docs/DEPLOYMENT.md
      # menjalankannya DI DALAM container ini (`docker compose exec backup
      # /usr/local/bin/restore-db.sh <nama>`), dan tanpa mount ini perintahnya
      # gagal "not found" — baru ketahuan saat benar-benar butuh restore.
      - ./scripts/restore-db.sh:/usr/local/bin/restore-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # caddy — auto-HTTPS reverse proxy with Let's Encrypt
  # ─────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?SITE_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────
# Named volumes — persistent data across container restarts
# ─────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  logs_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ─────────────────────────────────────────────────────────────
# Networks — isolated bridge network for inter-service comms
# ─────────────────────────────────────────────────────────────
networks:
  anichin-network:
    driver: bridge
