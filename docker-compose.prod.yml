# ============================================================================
# AniChin — Docker Compose (Production)
# Services: web + db (PostgreSQL 16) + redis + migrate + backup-cron + caddy
# Usage:
#   1. cp .env.example .env  (fill in real values!)
#   2. docker-compose -f docker-compose.prod.yml up -d
#   3. https://anichin.id
# ============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # db — PostgreSQL 16 with tuning for production
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: anichin-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=anichin
      - POSTGRES_USER=anichin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Performance tuning (adjust based on host RAM)
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C.UTF-8
    command:
      - "postgres"
      - "-c" 
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f"
    ports:
      - "127.0.0.1:5432:5432"  # Only bind to localhost — never expose publicly
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups/wal:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichin -d anichin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────
  # redis — rate limiting + session store + login lockout
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: anichin-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    ports:
      - "127.0.0.1:6379:6379"  # Local only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # migrate — one-shot init: applies Prisma migrations to PostgreSQL
  # Runs once on startup, then web service starts
  # ─────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      # Build the `migrate` stage: it has bun + the Prisma CLI/engines.
      # (The runtime stage has no `bunx`, so the old command always failed.)
      target: migrate
      args:
        DATABASE_PROVIDER: postgresql
    container_name: anichin-migrate
    restart: "no"
    command: ["bunx", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://anichin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/anichin?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anichin-network

  # ─────────────────────────────────────────────────────────────
  # web — Next.js 16 standalone production server
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DATABASE_PROVIDER: postgresql
    container_name: anichin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Local only — caddy handles public TLS
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://anichin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/anichin?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    networks:
      - anichin-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ─────────────────────────────────────────────────────────────
  # backup-cron — daily PostgreSQL backups at 02:00
  # Retention: 14 days
  # ─────────────────────────────────────────────────────────────
  backup-cron:
    image: postgres:16-alpine
    container_name: anichin-backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=anichin
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGDATABASE=anichin
      - BACKUP_RETENTION_DAYS=14
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /backups
        # Run initial backup on startup
        /usr/local/bin/backup.sh || true
        # Schedule daily backup at 02:00
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # caddy — auto-HTTPS reverse proxy with Let's Encrypt
  # ─────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: anichin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?SITE_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - anichin-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────
# Named volumes — persistent data across container restarts
# ─────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ─────────────────────────────────────────────────────────────
# Networks — isolated bridge network for inter-service comms
# ─────────────────────────────────────────────────────────────
networks:
  anichin-network:
    driver: bridge
