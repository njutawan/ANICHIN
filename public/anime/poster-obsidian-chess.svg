    <text x="0" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">OBSIDIAN CHESS</text>
    
    <text x="0" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#818cf8" opacity="0.9">黒曜のチェス</text>
    <text x="0" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1" opacity="0.7" letter-spacing="1">ORIGINAL ANIME SERIES</text>
