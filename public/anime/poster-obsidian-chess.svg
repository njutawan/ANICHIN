        <circle cx="150" cy="220" r="50" fill="#818cf8" opacity="0.12"/>
        <circle cx="150" cy="220" r="30" fill="#818cf8" opacity="0.2"/>
        <circle cx="150" cy="220" r="10" fill="#818cf8" opacity="0.6"/>
      </g></g>
  <g opacity="0.5">
    <circle cx="0" cy="0" r="1" fill="#818cf8" opacity="0.4"/><circle cx="73" cy="113" r="2" fill="#818cf8" opacity="0.4"/><circle cx="146" cy="226" r="3" fill="#818cf8" opacity="0.4"/><circle cx="219" cy="339" r="1" fill="#818cf8" opacity="0.4"/><circle cx="292" cy="452" r="2" fill="#818cf8" opacity="0.4"/><circle cx="365" cy="565" r="3" fill="#818cf8" opacity="0.4"/><circle cx="438" cy="678" r="1" fill="#818cf8" opacity="0.4"/><circle cx="511" cy="791" r="2" fill="#818cf8" opacity="0.4"/>
  </g>
  <rect width="600" height="900" fill="url(#fade-obsidian-chess)"/>
