<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg-obsidian-chess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050410"/>
    </linearGradient>
    <radialGradient id="glow-obsidian-chess" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade-obsidian-chess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050410" stop-opacity="0"/>
      <stop offset="60%" stop-color="#050410" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050410" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur-obsidian-chess"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg-obsidian-chess)"/>
  <rect width="600" height="900" fill="url(#glow-obsidian-chess)"/>
  <g transform="translate(150 0)">
