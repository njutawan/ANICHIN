# ============================================================================
# AniChin — Staging Deploy Pipeline
# Auto-deploys develop branch to staging environment
# Manual trigger: workflow_dispatch
# ============================================================================
name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7

      # `env.X` set on a step is not visible in its own `if:`, so resolve the
      # optional secrets once here and expose them as outputs.
      - name: Preflight (detect configured secrets)
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          REGISTRY: ${{ secrets.REGISTRY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          flag() { [ -n "$2" ] && echo "$1=true" || echo "$1=false"; }
          {
            flag deploy   "$DEPLOY_HOST"
            flag registry "$REGISTRY"
            flag slack    "$SLACK_WEBHOOK"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (PostgreSQL)
        # schema.prisma is already provider="postgresql" — no swap needed.
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || 'postgresql://anichin:anichin@localhost:5432/anichin?schema=public' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        if: steps.preflight.outputs.registry == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build & push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.preflight.outputs.registry == 'true' }}
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-${{ github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-latest
          build-args: |
            DATABASE_PROVIDER=postgresql
          cache-from: type=registry,ref=${{ secrets.REGISTRY || 'anichin' }}/anichin:buildcache

      - name: Deploy via SSH
        if: steps.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
            cd /opt/anichin-staging
            # Backup current state for rollback
            docker tag anichin:staging-latest anichin:staging-rollback-$(date +%s) 2>/dev/null || true
            # Pull and restart
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d --remove-orphans
            # Wait for health
            sleep 15
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
                echo "✓ Staging deploy successful"
                exit 0
              fi
              echo "Waiting for health... ($i/5)"
              sleep 10
            done
            echo "✗ Health check failed — initiating rollback"
            docker tag anichin:staging-rollback-latest anichin:staging-latest
            docker-compose -f docker-compose.staging.yml up -d --remove-orphans
            exit 1
          EOF

      - name: Notify Slack on failure
        if: failure() && steps.preflight.outputs.slack == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": "🚨 AniChin staging deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "username": "AniChin CI",
              "icon_emoji": ":rotating_light:"
            }
