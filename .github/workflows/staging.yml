# ============================================================================
# AniChin — Staging Deploy Pipeline
# Auto-deploys develop branch to staging environment
# Manual trigger: workflow_dispatch
#
# Staging memakai skrip yang SAMA dengan produksi
# (scripts/compose-deploy.sh) supaya perilakunya konsisten: pull → up →
# tunggu migrasi → health check → rollback. Sebelumnya workflow ini memeriksa
# `http://localhost:3000/api/health` padahal container staging dipublikasikan
# di 127.0.0.1:3001, sehingga staging SELALU "gagal health check" dan
# di-rollback ke tag image yang tidak pernah dibuat.
# ============================================================================
name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Token hanya butuh membaca repo (push image memakai kredensial registry).
permissions:
  contents: read
  actions: read

jobs:
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Do not let a successful PR workflow_run from a fork/untrusted branch
    # reach staging secrets or checkout; only a same-repo push to develop qualifies.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'develop')
    environment:
      name: staging
    steps:
      - name: 🛑 Verify CI success for manual staging deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Manual staging deploy is allowed only from develop."
            exit 1
          fi
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=develop&head_sha=$SOURCE_SHA&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful CI run found for $SOURCE_SHA; staging deploy is blocked."
            exit 1
          fi
          echo "✓ CI succeeded for $SOURCE_SHA."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # `env.X` set on a step is not visible in its own `if:`, so resolve the
      # optional secrets once here and expose them as outputs.
      - name: Preflight (detect configured secrets)
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          REGISTRY: ${{ secrets.REGISTRY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          flag() { [ -n "$2" ] && echo "$1=true" || echo "$1=false"; }
          {
            flag deploy   "$DEPLOY_HOST"
            flag registry "$REGISTRY"
            flag slack    "$SLACK_WEBHOOK"
          } | tee -a "$GITHUB_OUTPUT"

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning title=Staging dilewati::STAGING_DEPLOY_HOST kosong — image tetap di-build, tetapi tidak ada server yang di-deploy."
          fi

      - name: 🔍 Validate staging secrets before deploy
        if: steps.preflight.outputs.deploy == 'true'
        env:
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.STAGING_POSTGRES_APP_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
          TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.STAGING_TWO_FACTOR_ENCRYPTION_KEY }}
          SMTP_HOST: ${{ secrets.STAGING_SMTP_HOST }}
          SMTP_USER: ${{ secrets.STAGING_SMTP_USER }}
          SMTP_PASS: ${{ secrets.STAGING_SMTP_PASS }}
        run: |
          set -euo pipefail
          check_secret() {
            name="$1" value="$2" minimum="$3"
            [ "${#value}" -ge "$minimum" ] || { echo "::error::$name is too short"; exit 1; }
            lower=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              change-me*|replace-with*|your-*|example*|password*|secret123|*change-in-production*)
                echo "::error::$name contains a placeholder/weak value"; exit 1 ;;
            esac
            unique=$(printf '%s' "$value" | fold -w1 | sort -u | wc -l | tr -d ' ')
            [ "$unique" -ge 8 ] || { echo "::error::$name has insufficient character diversity"; exit 1; }
          }
          for name in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD NEXTAUTH_SECRET NEXTAUTH_URL TWO_FACTOR_ENCRYPTION_KEY SMTP_HOST SMTP_USER SMTP_PASS; do
            [ -n "${!name}" ] || { echo "::error::Missing required staging secret: $name"; exit 1; }
          done
          check_secret POSTGRES_PASSWORD "$POSTGRES_PASSWORD" 32
          check_secret POSTGRES_APP_PASSWORD "$POSTGRES_APP_PASSWORD" 32
          check_secret NEXTAUTH_SECRET "$NEXTAUTH_SECRET" 32
          check_secret TWO_FACTOR_ENCRYPTION_KEY "$TWO_FACTOR_ENCRYPTION_KEY" 64
          check_secret SMTP_PASS "$SMTP_PASS" 16
          [ "$POSTGRES_PASSWORD" != "$POSTGRES_APP_PASSWORD" ] || { echo "::error::Database passwords must differ"; exit 1; }
          [[ "$NEXTAUTH_URL" =~ ^https:// ]] || { echo "::error::NEXTAUTH_URL must use HTTPS"; exit 1; }
          printf '%s' "$TWO_FACTOR_ENCRYPTION_KEY" | grep -qE '^[0-9a-fA-F]{64}$' || { echo "::error::TWO_FACTOR_ENCRYPTION_KEY must be 64 hex characters"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to registry
        if: steps.preflight.outputs.registry == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # Dua target image, sama seperti produksi: `web` (runner) + `migrate`
      # (bun + Prisma CLI untuk service one-shot migrate).
      - name: Build & push image web (runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ steps.preflight.outputs.registry == 'true' }}
          # Lihat catatan di deploy.yml: attestation "unknown/unknown" bikin
          # Docker lama gagal pull.
          provenance: false
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-current
          build-args: |
            DATABASE_PROVIDER=postgresql
            NEXT_PUBLIC_SITE_URL=${{ secrets.STAGING_NEXTAUTH_URL }}
            NEXT_PUBLIC_BUILD_ID=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: ${{ steps.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache-staging', secrets.REGISTRY) || '' }}
          cache-to: ${{ steps.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache-staging,mode=max', secrets.REGISTRY) || '' }}

      - name: Build & push image migrate (Prisma CLI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: ${{ steps.preflight.outputs.registry == 'true' }}
          provenance: false
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-migrate-${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:staging-migrate
          build-args: |
            DATABASE_PROVIDER=postgresql

      # ── SSH dengan host key dipin (F-15) ────────────────────
      # Sama seperti deploy produksi: ssh-keyscan + StrictHostKeyChecking=no
      # membuat runner mempercayai kunci apa pun yang menjawab di DEPLOY_HOST,
      # padahal langkah berikutnya mengirim .env (rahasia sesi/OAuth) ke sana.
      - name: 🔐 Siapkan SSH (host key dipin dari secret)
        if: steps.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.STAGING_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "::error title=Host key SSH belum dipin::STAGING_DEPLOY_HOST terisi tetapi secret STAGING_DEPLOY_HOST_KEY kosong. Ambil di mesin tepercaya: 'ssh-keyscan -H <host>', cocokkan fingerprint-nya dengan kunci server, lalu simpan sebagai secret STAGING_DEPLOY_HOST_KEY (lihat docs/DEPLOYMENT.md langkah 8)."
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error title=Kunci SSH staging kosong::secret STAGING_DEPLOY_SSH_KEY kosong."
            exit 1
          fi

          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null \
             && ! grep -qF "$DEPLOY_HOST" ~/.ssh/known_hosts; then
            echo "::error title=STAGING_DEPLOY_HOST_KEY tidak memuat host::secret tidak memuat entri untuk '$DEPLOY_HOST'."
            exit 1
          fi
          echo "🔐 Host key dipin untuk $DEPLOY_HOST:"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: 📤 Upload compose + scripts ke server
        if: steps.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          APP_DIR: /opt/anichin-staging
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle/scripts/postgres-init
          cp docker-compose.staging.yml deploy-bundle/
          cp scripts/compose-deploy.sh scripts/deploy-env.sh scripts/backup-db.sh scripts/restore-db.sh deploy-bundle/scripts/
          # F-16: pembuat role aplikasi DML-only (sama seperti produksi).
          cp scripts/postgres-init/10-app-role.sh deploy-bundle/scripts/postgres-init/
          chmod +x deploy-bundle/scripts/*.sh deploy-bundle/scripts/postgres-init/*.sh

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$APP_DIR/scripts/postgres-init'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/docker-compose.staging.yml "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/scripts/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/scripts/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/scripts/postgres-init/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/scripts/postgres-init/"

      - name: ⚙️ Bootstrap .env staging (required for deployment)
        if: steps.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          APP_DIR: /opt/anichin-staging
          REGISTRY: ${{ secrets.REGISTRY }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          # F-16: kredensial role aplikasi (DML-only) — wajib diisi compose staging.
          POSTGRES_APP_PASSWORD: ${{ secrets.STAGING_POSTGRES_APP_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
          TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.STAGING_TWO_FACTOR_ENCRYPTION_KEY }}
          SMTP_HOST: ${{ secrets.STAGING_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.STAGING_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.STAGING_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.STAGING_SMTP_USER }}
          SMTP_PASS: ${{ secrets.STAGING_SMTP_PASS }}
          SMTP_FROM: ${{ secrets.STAGING_SMTP_FROM }}
          ANICHIN_IMAGE: ${{ secrets.REGISTRY }}/anichin:staging-current
          ANICHIN_MIGRATE_IMAGE: ${{ secrets.REGISTRY }}/anichin:staging-migrate
        run: |
          set -euo pipefail
          # Registry kosong → jangan tulis ANICHIN_IMAGE (biar compose memakai
          # default-nya sendiri dan build lokal).
          if [ -z "${REGISTRY:-}" ]; then
            ANICHIN_IMAGE=""
            ANICHIN_MIGRATE_IMAGE=""
          fi

          # Encode on the runner so secret characters/newlines cannot inject
          # additional records into the server's line-oriented .env bootstrap.
          send_secret() {
            local key="$1"
            local value="${!key}"
            printf '%s_B64=%s\n' "$key" "$(printf '%s' "$value" | base64 -w0)"
          }
          {
            for key in \
              POSTGRES_PASSWORD POSTGRES_APP_PASSWORD NEXTAUTH_SECRET NEXTAUTH_URL \
              TWO_FACTOR_ENCRYPTION_KEY SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER \
              SMTP_PASS SMTP_FROM ANICHIN_IMAGE ANICHIN_MIGRATE_IMAGE
            do
              send_secret "$key"
            done
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$APP_DIR' && ENV_FILE='$APP_DIR/.env' ./scripts/deploy-env.sh"

      - name: 🚀 Deploy staging (pull → migrate → health check → rollback)
        if: steps.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          APP_DIR: /opt/anichin-staging
          SKIP_PULL: ${{ steps.preflight.outputs.registry == 'true' && '0' || '1' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' ENVIRONMENT='staging' COMPOSE_FILE='docker-compose.staging.yml' SKIP_PULL='$SKIP_PULL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          ./scripts/compose-deploy.sh
          REMOTE

      - name: Notify Slack on failure
        if: failure() && steps.preflight.outputs.slack == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          # `webhook` + `webhook-type` wajib di action v4 — tanpa keduanya
          # notifikasi tidak pernah terkirim (action membaca
          # process.env.SLACK_WEBHOOK_URL, bukan SLACK_WEBHOOK).
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 AniChin staging deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "username": "AniChin CI",
              "icon_emoji": ":rotating_light:"
            }
