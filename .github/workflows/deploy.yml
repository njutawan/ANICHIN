# ============================================================================
# AniChin — Production Deploy Pipeline
# Triggered: push to main, manual dispatch
# Features: build → push image → migrate DB → deploy → health check → rollback on fail
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      rollback:
        description: 'Rollback to previous version?'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      # ── Pre-deploy: validate OAuth secrets are set ──────────
      - name: 🔍 Validate OAuth configuration
        if: github.event.inputs.rollback != 'true'
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "Verifying required OAuth env vars..."
          MISSING=()
          [ -z "$NEXTAUTH_SECRET" ] && MISSING+=("NEXTAUTH_SECRET")
          [ -z "$NEXTAUTH_URL" ] && MISSING+=("NEXTAUTH_URL")
          [ -z "$GOOGLE_CLIENT_ID" ] && MISSING+=("GOOGLE_CLIENT_ID")
          [ -z "$GOOGLE_CLIENT_SECRET" ] && MISSING+=("GOOGLE_CLIENT_SECRET")
          [ -z "$GITHUB_CLIENT_ID" ] && MISSING+=("GITHUB_CLIENT_ID")
          [ -z "$GITHUB_CLIENT_SECRET" ] && MISSING+=("GITHUB_CLIENT_SECRET")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING[*]}"
            echo ""
            echo "Configure them at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          # Validate NEXTAUTH_URL is HTTPS in production
          if [[ ! "$NEXTAUTH_URL" =~ ^https:// ]]; then
            echo "::error::NEXTAUTH_URL must use HTTPS in production (got: $NEXTAUTH_URL)"
            exit 1
          fi

          # Validate NEXTAUTH_SECRET length
          if [ ${#NEXTAUTH_SECRET} -lt 32 ]; then
            echo "::error::NEXTAUTH_SECRET too short (${#NEXTAUTH_SECRET} chars, need ≥32)"
            echo "Generate with: openssl rand -base64 32"
            exit 1
          fi

          # Validate Google OAuth format
          if [[ ! "$GOOGLE_CLIENT_ID" =~ \.apps\.googleusercontent\.com$ ]]; then
            echo "::warning::GOOGLE_CLIENT_ID format unusual (expected to end with .apps.googleusercontent.com)"
          fi
          if [[ ! "$GOOGLE_CLIENT_SECRET" =~ ^GOCSPX- ]]; then
            echo "::warning::GOOGLE_CLIENT_SECRET format unusual (expected to start with GOCSPX-)"
          fi

          echo "✅ All required OAuth env vars are set"
          echo "  NEXTAUTH_URL: $NEXTAUTH_URL"
          echo "  NEXTAUTH_SECRET: [${#NEXTAUTH_SECRET} chars]"
          echo "  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:0:30}..."
          echo "  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:0:20}..."

      # ── Rollback path ─────────────────────────────────────
      - name: 🔄 Rollback to previous version
        if: github.event.inputs.rollback == 'true' && env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
            cd /opt/anichin-${ENVIRONMENT:-production}
            # Find the most recent rollback image
            ROLLBACK_TAG=$(docker images --format "{{.Tag}}" anichin/anichin | grep -E "^prod-rollback-" | sort -r | head -1)
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "::error::No rollback image found"
              exit 1
            fi
            echo "Rolling back to: $ROLLBACK_TAG"
            docker tag anichin/anichin:$ROLLBACK_TAG anichin/anichin:prod-current
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 15
            curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"' || exit 1
            echo "✓ Rollback successful"
          EOF
          exit 0

      # ── Normal deploy path ─────────────────────────────────
      - name: Setup Bun
        if: github.event.inputs.rollback != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event.inputs.rollback != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (PostgreSQL)
        if: github.event.inputs.rollback != 'true'
        # schema.prisma is already provider="postgresql" — no swap needed.
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set up Docker Buildx
        if: github.event.inputs.rollback != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event.inputs.rollback != 'true' && env.REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build & push production image
        if: github.event.inputs.rollback != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.REGISTRY != '' }}
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-${{ github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-latest
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-current
          build-args: |
            DATABASE_PROVIDER=postgresql
          cache-from: type=registry,ref=${{ secrets.REGISTRY || 'anichin' }}/anichin:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY || 'anichin' }}/anichin:buildcache,mode=max

      - name: Deploy via SSH (Docker Compose)
        if: github.event.inputs.rollback != 'true' && env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # Pre-deploy backup
          echo "📦 Creating pre-deploy DB backup..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
            cd /opt/anichin-${ENVIRONMENT:-production}
            ./scripts/backup-db.sh pre-deploy-$(date +%Y%m%d-%H%M%S) || echo "Backup failed (continuing)"
          EOF

          # Tag current image as rollback target
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
            docker tag anichin/anichin:prod-current anichin/anichin:prod-rollback-$(date +%s) 2>/dev/null || true
          EOF

          # Deploy & health check
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
            set -euo pipefail
            cd /opt/anichin-${ENVIRONMENT:-production}
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for migrate service to complete
            echo "⏳ Waiting for migrations..."
            timeout 120 docker-compose -f docker-compose.prod.yml run --rm migrate bunx prisma migrate deploy || true

            # Health check with retries
            echo "🏥 Health check..."
            sleep 20
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
                echo "✅ Deploy successful — health check passed"
                exit 0
              fi
              echo "Waiting for health... ($i/6)"
              sleep 10
            done

            # Health check failed — initiate rollback
            echo "❌ Health check failed — initiating automatic rollback"
            ROLLBACK_TAG=$(docker images --format "{{.Tag}}" anichin/anichin | grep -E "^prod-rollback-" | sort -r | head -1)
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "❌ No rollback image available — manual intervention required"
              exit 1
            fi
            echo "Rolling back to: $ROLLBACK_TAG"
            docker tag anichin/anichin:$ROLLBACK_TAG anichin/anichin:prod-current
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 15
            curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"' && echo "✅ Rollback successful" || exit 1
          EOF

      - name: Run smoke tests
        if: github.event.inputs.rollback != 'true' && env.NEXTAUTH_URL != ''
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          # Health endpoint
          curl -sf "$NEXTAUTH_URL/api/health" | grep -q '"status":"ok"'
          echo "✓ Health endpoint OK"

          # Auth providers
          curl -sf "$NEXTAUTH_URL/api/auth/providers" | grep -q '"credentials"'
          echo "✓ Auth endpoint OK"

          # Static pages
          curl -sf -o /dev/null -w "Home: %{http_code}\n" "$NEXTAUTH_URL/"
          curl -sf -o /dev/null -w "Login: %{http_code}\n" "$NEXTAUTH_URL/auth/login"
          curl -sf -o /dev/null -w "Manifest: %{http_code}\n" "$NEXTAUTH_URL/manifest.webmanifest"
          echo "✓ All smoke tests passed"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 AniChin ${{ env.ENVIRONMENT }} deploy failed!\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.event.head_commit.message }}",
              "username": "AniChin CI",
              "icon_emoji": ":rotating_light:"
            }

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ AniChin ${{ env.ENVIRONMENT }} deploy successful!\nCommit: ${{ github.event.head_commit.id }}\nAuthor: ${{ github.event.head_commit.author.name }}",
              "username": "AniChin CI",
              "icon_emoji": ":tada:"
            }
