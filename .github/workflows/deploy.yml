# ============================================================================
# AniChin — Production Deploy Pipeline
# Triggered after the CI workflow succeeds on main, or by guarded manual dispatch
# Features: build → push image → bootstrap server → deploy → health check →
#           rollback on fail
#
# Alur deploy (ringkas):
#   1. 🧭 Preflight      — deteksi secret yang tersedia (tanpa ini `secrets`
#                          tidak bisa dibaca di `jobs.<id>.if`).
#   2. 🔍 Validate       — NEXTAUTH_SECRET/NEXTAUTH_URL wajib; provider OAuth
#                          opsional hanya memunculkan warning.
#   3. 🐳 Build & push   — DUA target image:
#                            web     → <registry>/anichin:prod-current
#                            migrate → <registry>/anichin:prod-migrate
#                          Nama image ini sama dengan yang dipakai
#                          docker-compose.prod.yml, sehingga `docker compose pull`
#                          di server benar-benar menarik image hasil CI dan
#                          rollback (tag ulang image lama) punya efek.
#   4. 📤 Bootstrap      — kirim docker-compose.prod.yml + Caddyfile + scripts
#                          ke /opt/anichin-<env>, lalu tulis/perbarui .env dari
#                          secret (lihat scripts/deploy-env.sh).
#   5. 🚀 Deploy         — scripts/compose-deploy.sh: pull → up → tunggu migrasi
#                          → health check → rollback otomatis bila gagal.
#   6. 🧪 Smoke test     — cek endpoint publik dari runner.
#
# Catatan perilaku: kalau `DEPLOY_HOST` belum diset, job `deploy` DI-SKIP dan
# run tetap hijau — tetapi job `preflight` selalu menuliskan annotation yang
# menegaskan bahwa tidak ada yang di-deploy, jadi tidak ada "hijau palsu" yang
# diam. `workflow_dispatch` manual tanpa target tetap GAGAL keras (niat
# eksplisit untuk deploy tidak boleh berakhir no-op). Untuk sengaja menjalankan
# build-only, set repository variable `BUILD_ONLY=true`
# (Settings → Secrets and variables → Actions → Variables).
#
# Prasyarat di server (sekali saja, lihat docs/DEPLOYMENT.md):
#   • Docker + plugin `docker compose` v2
#   • user deploy bisa menjalankan docker
#   • `docker login <registry>` bila registry-nya privat
# ============================================================================
name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      rollback:
        description: 'Rollback to previous version?'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

# Token hanya butuh membaca repo: image di-push memakai kredensial registry
# (secrets.REGISTRY_USER/PASS), bukan GITHUB_TOKEN.
permissions:
  contents: read
  actions: read

jobs:
  # ── Job 1: Preflight — deteksi target deploy ───────────────
  # `secrets` tidak bisa dibaca di `jobs.<id>.if`, jadi deteksi konfigurasi
  # dipisah ke job sendiri lalu diteruskan ke job `deploy` lewat outputs+needs.
  # Job inilah yang selalu "bersuara" (annotation) soal apa yang sebenarnya
  # terjadi, supaya run hijau tidak pernah berarti "sudah di-deploy".
  preflight:
    name: 🧭 Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_run can report PR completions too: deploy only from a successful
    # same-repo push to main, never by checking out untrusted PR code with secrets.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      host_key: ${{ steps.detect.outputs.host_key }}
      registry: ${{ steps.detect.outputs.registry }}
      smoke: ${{ steps.detect.outputs.smoke }}
      slack: ${{ steps.detect.outputs.slack }}
      build_only: ${{ steps.detect.outputs.build_only }}
      proceed: ${{ steps.detect.outputs.proceed }}
    steps:
      # Automatic deploys require successful CI for a push from this repository
      # to main (never a successful untrusted pull_request workflow_run).
      # Manual deploys prove the exact main SHA; explicit rollback is the only
      # path that intentionally restores an old image without a fresh CI run.
      - name: 🛑 Verify CI success for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual deploy is allowed only from main."
            exit 1
          fi
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SOURCE_SHA&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful CI run found for $SOURCE_SHA; deployment is blocked."
            exit 1
          fi
          echo "✓ CI succeeded for $SOURCE_SHA."

      # NOTE: `env.X` set on a step is NOT visible in that same step's `if:`,
      # so the old `if: env.DEPLOY_HOST != ''` conditions were always false
      # (deploy/login/smoke silently skipped). Secrets are resolved here once
      # and exposed as job outputs instead.
      - name: 🧭 Preflight (detect configured secrets)
        id: detect
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Host key SSH yang dipin (F-15) — isinya baris known_hosts untuk
          # DEPLOY_HOST. Tanpa ini deploy dihentikan (lihat guard di bawah).
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          REGISTRY: ${{ secrets.REGISTRY }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          # Escape hatch eksplisit: repository variable (bukan secret).
          BUILD_ONLY: ${{ vars.BUILD_ONLY }}
        run: |
          flag() { [ -n "$2" ] && echo "$1=true" || echo "$1=false"; }
          {
            flag deploy     "$DEPLOY_HOST"
            flag host_key   "$DEPLOY_HOST_KEY"
            flag registry   "$REGISTRY"
            flag smoke      "$NEXTAUTH_URL"
            flag slack      "$SLACK_WEBHOOK"
            flag build_only "$BUILD_ONLY"
          } | tee -a "$GITHUB_OUTPUT"

          # `proceed` = job deploy punya sesuatu yang bisa dikerjakan.
          if [ -n "$DEPLOY_HOST" ] || [ "$BUILD_ONLY" = "true" ]; then
            echo "proceed=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "proceed=false" | tee -a "$GITHUB_OUTPUT"
          fi

          # Alasan selalu ditulis eksplisit sebagai annotation.
          if [ -n "$DEPLOY_HOST" ] && [ -z "$DEPLOY_HOST_KEY" ]; then
            # F-15: jangan pernah kembali ke `ssh-keyscan` + StrictHostKeyChecking=no
            # hanya karena secret ini belum diisi.
            echo "::error title=Host key SSH belum dipin::DEPLOY_HOST terisi, tetapi secret DEPLOY_HOST_KEY kosong — pipeline tidak akan mempercayai kunci apa pun tanpa pin. Jalankan di mesin tepercaya: 'ssh-keyscan -H <$DEPLOY_HOST> > deploy_host_key.txt', COCOKKAN fingerprint-nya dengan kunci server yang sebenarnya (mis. lewat panel hosting/konsol), lalu simpan isi file itu sebagai secret DEPLOY_HOST_KEY."
          fi

          if [ -n "$DEPLOY_HOST" ]; then
            echo "✅ DEPLOY_HOST terkonfigurasi — build → push → deploy → smoke test akan berjalan."
            if [ -z "$REGISTRY" ]; then
              echo "::warning title=Registry belum diset::REGISTRY kosong, jadi image hanya di-build (push=false) dan server harus punya source repo untuk build lokal. Langkah deploy tetap dijalankan dengan SKIP_PULL=1."
            fi
          elif [ "$BUILD_ONLY" = "true" ]; then
            echo "::notice title=Mode build-only::BUILD_ONLY=true — image di-build (dan di-push bila REGISTRY diset); langkah SSH deploy + smoke test dilewati."
          else
            echo "::warning title=Deploy dilewati — tidak ada target::DEPLOY_HOST kosong dan BUILD_ONLY tidak diset, jadi job deploy di-skip: tidak ada image yang di-build dan tidak ada server yang di-deploy. Isi secret DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY (+ NEXTAUTH_URL untuk smoke test) agar benar-benar men-deploy, atau set repository variable BUILD_ONLY=true bila memang hanya ingin build image."
          fi

      # ── Guard: dispatch manual tanpa target = GAGAL keras ───
      # Push ke main tanpa konfigurasi hanya di-skip (lihat warning di atas),
      # tetapi menjalankan workflow ini manual adalah niat eksplisit untuk
      # deploy/rollback — tidak boleh berakhir diam-diam tanpa apa pun.
      #
      # Sebelumnya guard ini juga aktif untuk push ke main, sehingga SETIAP
      # push ke main SELALU merah selama secret deploy belum diisi — padahal
      # job `deploy` sudah di-skip dengan alasan yang jelas. Sekarang guard
      # hanya berlaku untuk pemanggilan manual (workflow_dispatch).
      - name: ❌ Guard — workflow_dispatch tanpa target deploy
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.proceed != 'true'
        run: |
          echo "::error title=Deploy tidak dikonfigurasi::Workflow ini dijalankan manual, tetapi DEPLOY_HOST kosong dan BUILD_ONLY tidak diset — tidak ada yang bisa di-deploy maupun di-rollback. Isi secret deploy, atau set repository variable BUILD_ONLY=true bila memang ingin build-only."
          exit 1

      # Guard F-15: dispatch manual dengan DEPLOY_HOST tetapi tanpa host key
      # = GAGAL keras, sebelum satu pun langkah build/SSH berjalan.
      - name: ❌ Guard — host key SSH belum dipin
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.deploy == 'true' && steps.detect.outputs.host_key != 'true'
        run: |
          echo "::error title=Host key SSH belum dipin::DEPLOY_HOST terisi, tetapi secret DEPLOY_HOST_KEY kosong. Tanpa host key yang dipin, verifikasi SSH dilewati dan pipeline bisa menyerahkan image/kredensial registry/.env ke host yang menyamar sebagai server deploy. Jalankan 'ssh-keyscan -H <host>' di mesin tepercaya, cocokkan fingerprint dengan kunci server sebenarnya, lalu simpan sebagai secret DEPLOY_HOST_KEY."
          exit 1

  # ── Job 2: Deploy (build → push → SSH → smoke test) ────────
  deploy:
    name: 🚀 Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    # Di-skip (bukan gagal) bila repo belum punya target deploy dan BUILD_ONLY
    # tidak diset — push ke main tidak lagi merah hanya karena belum ada server.
    if: needs.preflight.outputs.proceed == 'true'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 🧭 Resolve deploy settings
        id: cfg
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          set -euo pipefail
          # Direktori di server (dibuat otomatis oleh langkah Bootstrap).
          #   production → /opt/anichin-production
          #   staging    → /opt/anichin-staging
          echo "app_dir=/opt/anichin-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          # Nama image harus sama dengan default di docker-compose.prod.yml.
          if [ -n "$REGISTRY" ]; then
            echo "web_image=${REGISTRY}/anichin:prod-current" >> "$GITHUB_OUTPUT"
            echo "migrate_image=${REGISTRY}/anichin:prod-migrate" >> "$GITHUB_OUTPUT"
          else
            echo "web_image=anichin/anichin:prod-current" >> "$GITHUB_OUTPUT"
            echo "migrate_image=anichin/anichin:prod-migrate" >> "$GITHUB_OUTPUT"
          fi

      # ── Pre-deploy: validate required config ────────────────
      - name: 🔍 Validate deployment configuration
        if: github.event.inputs.rollback != 'true' && needs.preflight.outputs.deploy == 'true'
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # F-16: kredensial role aplikasi (DML-only) — berbeda dari role owner.
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.TWO_FACTOR_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          check_secret() {
            local name="$1" value="$2" minimum="$3"
            if [ "${#value}" -lt "$minimum" ]; then
              echo "::error::$name must be at least $minimum characters"
              exit 1
            fi
            local lower unique
            lower=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              change-me*|replace-with*|your-*|example*|password*|secret123|*change-in-production*)
                echo "::error::$name contains a known placeholder/weak value"
                exit 1
                ;;
            esac
            unique=$(printf '%s' "$value" | fold -w1 | sort -u | wc -l | tr -d ' ')
            if [ "$unique" -lt 8 ]; then
              echo "::error::$name does not have enough character diversity"
              exit 1
            fi
          }

          MISSING=()
          for name in NEXTAUTH_SECRET NEXTAUTH_URL TWO_FACTOR_ENCRYPTION_KEY SMTP_HOST SMTP_USER SMTP_PASS; do
            [ -n "${!name}" ] || MISSING+=("$name")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING[*]}"
            echo "Configure them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          check_secret NEXTAUTH_SECRET "$NEXTAUTH_SECRET" 32
          if [[ ! "$NEXTAUTH_URL" =~ ^https:// ]]; then
            echo "::error::NEXTAUTH_URL must use HTTPS in production"
            exit 1
          fi
          if ! printf '%s' "$TWO_FACTOR_ENCRYPTION_KEY" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "::error::TWO_FACTOR_ENCRYPTION_KEY must be exactly 64 hexadecimal characters"
            exit 1
          fi
          check_secret TWO_FACTOR_ENCRYPTION_KEY "$TWO_FACTOR_ENCRYPTION_KEY" 64
          check_secret SMTP_PASS "$SMTP_PASS" 16

          # Optional in GitHub only when an already-configured server .env is
          # used; docker-compose's env-check validates the effective values.
          for name in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then check_secret "$name" "$value" 32; fi
          done
          if [ -n "$POSTGRES_PASSWORD" ] && [ -n "$POSTGRES_APP_PASSWORD" ] && [ "$POSTGRES_PASSWORD" = "$POSTGRES_APP_PASSWORD" ]; then
            echo "::error::POSTGRES_PASSWORD and POSTGRES_APP_PASSWORD must differ"
            exit 1
          fi

          # Provider OAuth is optional; only configured buttons are shown.
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning title=Google OAuth tidak aktif::Google OAuth credentials are not configured."
          fi
          if [ -z "$GITHUB_CLIENT_ID" ] || [ -z "$GITHUB_CLIENT_SECRET" ]; then
            echo "::warning title=GitHub OAuth tidak aktif::GitHub OAuth credentials are not configured."
          fi

          echo "✅ Required production secrets validated."
          echo "  NEXTAUTH_URL: $NEXTAUTH_URL"
          echo "  NEXTAUTH_SECRET: [${#NEXTAUTH_SECRET} chars; value hidden]"

      # Rollback manual saat DEPLOY_HOST belum diisi → job akan "sukses" tanpa
      # melakukan apa pun (semua langkah lain di-skip). Itu hijau palsu, jadi
      # dibuat gagal keras.
      - name: ❌ Guard — rollback manual tanpa target
        if: github.event.inputs.rollback == 'true' && needs.preflight.outputs.deploy != 'true'
        run: |
          echo "::error title=Rollback tidak dikonfigurasi::Rollback diminta, tetapi DEPLOY_HOST kosong — tidak ada server yang bisa di-rollback. Isi secret DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY."
          exit 1

      # ── SSH dengan host key dipin (F-15) ────────────────────
      # Sebelumnya tiap langkah SSH menjalankan:
      #   ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      #   ssh -o StrictHostKeyChecking=no …
      # → kegagalan keyscan ditelan `|| true` DAN verifikasi host key dimatikan,
      # jadi runner menerima kunci apa pun yang menjawab di DEPLOY_HOST. Sekarang
      # known_hosts ditulis dari secret DEPLOY_HOST_KEY, isinya divalidasi, dan
      # semua perintah ssh/scp memakai StrictHostKeyChecking=yes.
      - name: 🔐 Siapkan SSH (host key dipin dari secret)
        if: success() && needs.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error title=Deploy dihentikan::DEPLOY_HOST kosong."
            exit 1
          fi
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "::error title=Host key SSH belum dipin::DEPLOY_HOST_KEY kosong. Isi dengan baris known_hosts untuk $DEPLOY_HOST (lihat docs/DEPLOYMENT.md langkah 8) sebelum men-deploy."
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error title=Kunci SSH deploy kosong::DEPLOY_SSH_KEY kosong — tidak ada kunci untuk autentikasi."
            exit 1
          fi

          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts HANYA dari secret: tidak ada keyscan (TOFU) di runner.
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Pastikan entri untuk DEPLOY_HOST benar-benar ada sebelum dipakai.
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null              && ! grep -qF "$DEPLOY_HOST" ~/.ssh/known_hosts; then
            echo "::error title=DEPLOY_HOST_KEY tidak memuat host::$DEPLOY_HOST_KEY tidak memuat entri untuk '$DEPLOY_HOST'. Isinya harus keluaran 'ssh-keyscan -H $DEPLOY_HOST'."
            exit 1
          fi
          echo "🔐 Host key dipin untuk $DEPLOY_HOST:"
          ssh-keygen -lf ~/.ssh/known_hosts

      # ── Rollback path (manual dispatch) ────────────────────
      - name: 🔄 Rollback to previous version
        if: github.event.inputs.rollback == 'true' && needs.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          APP_DIR: ${{ steps.cfg.outputs.app_dir }}
          # Dilewatkan ke skrip di server; nama image harus sama seperti saat
          # deploy supaya tag rollback yang dicari tepat.
          ANICHIN_IMAGE: ${{ steps.cfg.outputs.web_image }}
          ANICHIN_MIGRATE_IMAGE: ${{ steps.cfg.outputs.migrate_image }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' ENVIRONMENT='$ENVIRONMENT' ROLLBACK_ONLY=1 ANICHIN_IMAGE='$ANICHIN_IMAGE' ANICHIN_MIGRATE_IMAGE='$ANICHIN_MIGRATE_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          if [ ! -x ./scripts/compose-deploy.sh ]; then
            echo "::error::$APP_DIR/scripts/compose-deploy.sh tidak ada — jalankan Deploy Production (tanpa rollback) sekali dulu, langkah '📤 Upload deploy files' yang mengirim skrip ini."
            exit 1
          fi
          # Skrip ini juga dipakai jalur deploy normal; mode ROLLBACK_ONLY hanya
          # mengembalikan tag rollback terbaru lalu menjalankan ulang stack.
          NO_PULL=1 ./scripts/compose-deploy.sh
          REMOTE

      # ── Normal deploy path ─────────────────────────────────
      - name: Set up Docker Buildx
        if: github.event.inputs.rollback != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to registry
        if: github.event.inputs.rollback != 'true' && needs.preflight.outputs.registry == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # Image `web` (runner): Next.js standalone — yang melayani trafik.
      # Catatan: langkah `bun install` + `prisma generate` di runner CI DIHAPUS.
      # Keduanya hanya menyiapkan artefak yang tidak dipakai: seluruh dependency
      # dan Prisma client dihasilkan di dalam image (stage deps/builder), jadi
      # langkah itu hanya menambah ~1 menit dan satu titik gagal.
      #
      # `provenance: false`: buildx menambahkan manifest attestation
      # ("unknown/unknown") pada image yang di-push; Docker di server lama
      # (<= 24) menolak pull manifest seperti itu → deploy gagal saat
      # `docker compose pull`. Dinonaktifkan supaya image bisa di-pull di semua
      # versi Docker yang didukung docs/DEPLOYMENT.md.
      - name: Build & push image web (Next.js standalone)
        if: github.event.inputs.rollback != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ needs.preflight.outputs.registry == 'true' }}
          provenance: false
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-latest
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-current
          build-args: |
            DATABASE_PROVIDER=postgresql
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXTAUTH_URL }}
            NEXT_PUBLIC_BUILD_ID=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: ${{ needs.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache', secrets.REGISTRY) || '' }}
          cache-to: ${{ needs.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache,mode=max', secrets.REGISTRY) || '' }}

      # Image `migrate`: stage dengan bun + Prisma CLI, dipakai service one-shot
      # `migrate` di docker-compose.prod.yml. Tanpa image ini, server tanpa
      # source repo tidak bisa menjalankan `prisma migrate deploy`.
      - name: Build & push image migrate (Prisma CLI)
        if: github.event.inputs.rollback != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: ${{ needs.preflight.outputs.registry == 'true' }}
          provenance: false
          tags: |
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-migrate-${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ secrets.REGISTRY || 'anichin' }}/anichin:prod-migrate
          build-args: |
            DATABASE_PROVIDER=postgresql
          cache-from: ${{ needs.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache-migrate', secrets.REGISTRY) || '' }}
          cache-to: ${{ needs.preflight.outputs.registry == 'true' && format('type=registry,ref={0}/anichin:buildcache-migrate,mode=max', secrets.REGISTRY) || '' }}

      - name: 📤 Upload deploy files to server
        if: success() && github.event.inputs.rollback != 'true' && needs.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ steps.cfg.outputs.app_dir }}
        run: |
          set -euo pipefail
          # Bundle = file yang perlu ada di server. Source aplikasi TIDAK
          # dikirim: image sudah berisi semuanya, dan config dikirim dari commit
          # yang sedang di-deploy supaya tidak pernah berbeda dari image.
          mkdir -p deploy-bundle/scripts/postgres-init
          cp docker-compose.prod.yml Caddyfile deploy-bundle/
          cp scripts/compose-deploy.sh scripts/deploy-env.sh scripts/backup-db.sh scripts/restore-db.sh deploy-bundle/scripts/
          # F-16: skrip role aplikasi DB — di-mount ke /docker-entrypoint-initdb.d
          # dan dipanggil ulang (idempoten) oleh compose-deploy.sh.
          cp scripts/postgres-init/10-app-role.sh deploy-bundle/scripts/postgres-init/
          chmod +x deploy-bundle/scripts/*.sh deploy-bundle/scripts/postgres-init/*.sh

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$APP_DIR/scripts/postgres-init' '$APP_DIR/backups'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/docker-compose.prod.yml deploy-bundle/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/scripts/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/scripts/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -q \
            deploy-bundle/scripts/postgres-init/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/scripts/postgres-init/"
          echo "✓ File deploy terkirim ke $APP_DIR"

      - name: ⚙️ Bootstrap .env di server (tanpa menimpa setelan manual)
        if: success() && github.event.inputs.rollback != 'true' && needs.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ steps.cfg.outputs.app_dir }}
          # Secret dikirim lewat STDIN, bukan argv; transportnya base64 agar
          # karakter khusus/newline tidak bisa inject catatan .env tambahan.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # F-16: kredensial role aplikasi — disimpan terpisah di .env server.
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.TWO_FACTOR_ENCRYPTION_KEY }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ANICHIN_IMAGE: ${{ steps.cfg.outputs.web_image }}
          ANICHIN_MIGRATE_IMAGE: ${{ steps.cfg.outputs.migrate_image }}
        run: |
          set -euo pipefail
          # SITE_DOMAIN untuk Caddy: pakai secret bila ada, kalau tidak
          # diturunkan dari host NEXTAUTH_URL (dipakai di domain + www).
          if [ -z "${SITE_DOMAIN:-}" ]; then
            SITE_DOMAIN="${NEXTAUTH_URL#*://}"
            SITE_DOMAIN="${SITE_DOMAIN%%/*}"
          fi

          # Encode on the runner so quotes, $, spaces, or embedded newlines in
          # a GitHub secret cannot inject extra KEY=VALUE records over SSH.
          send_secret() {
            local key="$1"
            local value="${!key}"
            printf '%s_B64=%s\n' "$key" "$(printf '%s' "$value" | base64 -w0)"
          }
          {
            for key in \
              POSTGRES_PASSWORD POSTGRES_APP_PASSWORD NEXTAUTH_SECRET NEXTAUTH_URL \
              NEXT_PUBLIC_SITE_URL SITE_DOMAIN TWO_FACTOR_ENCRYPTION_KEY IP_HASH_SALT \
              GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
              SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_FROM \
              ANICHIN_IMAGE ANICHIN_MIGRATE_IMAGE
            do
              send_secret "$key"
            done
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$APP_DIR' && ENV_FILE='$APP_DIR/.env' ./scripts/deploy-env.sh"

      - name: 🚀 Deploy via Docker Compose (pull → migrate → health → rollback)
        if: success() && github.event.inputs.rollback != 'true' && needs.preflight.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          APP_DIR: ${{ steps.cfg.outputs.app_dir }}
          ANICHIN_IMAGE: ${{ steps.cfg.outputs.web_image }}
          ANICHIN_MIGRATE_IMAGE: ${{ steps.cfg.outputs.migrate_image }}
          # Tanpa registry, image tidak ada di mana pun: server harus punya
          # source repo + Dockerfile untuk build lokal.
          SKIP_PULL: ${{ needs.preflight.outputs.registry == 'true' && '0' || '1' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' ENVIRONMENT='$ENVIRONMENT' SKIP_PULL='$SKIP_PULL' ANICHIN_IMAGE='$ANICHIN_IMAGE' ANICHIN_MIGRATE_IMAGE='$ANICHIN_MIGRATE_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          # Validasi Caddyfile lebih dulu: direktif/matcher yang salah membuat
          # container caddy gagal start (situs mati total), dan lebih murah
          # ketahuan sekarang daripada setelah `up -d`.
          if [ -x ./scripts/compose-deploy.sh ]; then :; else chmod +x ./scripts/*.sh; fi

          # SITE_DOMAIN diambil dari .env server (diisi langkah Bootstrap) supaya
          # yang divalidasi benar-benar konfigurasi yang akan dipakai.
          SITE_DOMAIN="$(sed -n 's/^SITE_DOMAIN=//p' .env 2>/dev/null | tail -n 1 | sed 's/^"//; s/"$//')"
          echo "▶ Validasi Caddyfile (SITE_DOMAIN=${SITE_DOMAIN:-<kosong>})…"
          # ENTRYPOINT image caddy adalah `caddy`, jadi argumen pertama = subcommand.
          docker run --rm -e "SITE_DOMAIN=${SITE_DOMAIN:-example.com}" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile

          ./scripts/compose-deploy.sh
          REMOTE

      - name: 🧪 Smoke tests (endpoint publik)
        if: success() && github.event.inputs.rollback != 'true' && needs.preflight.outputs.deploy == 'true' && needs.preflight.outputs.smoke == 'true'
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          # Endpoint kesehatan
          curl -sf "$NEXTAUTH_URL/api/health" | grep -q '"status":"ok"'
          echo "✓ Health endpoint OK"

          # Auth providers (credentials selalu ada)
          curl -sf "$NEXTAUTH_URL/api/auth/providers" | grep -q '"credentials"'
          echo "✓ Auth endpoint OK"

          # Halaman statis + manifest PWA
          curl -sf -o /dev/null -w "Home: %{http_code}\n" "$NEXTAUTH_URL/"
          curl -sf -o /dev/null -w "Login: %{http_code}\n" "$NEXTAUTH_URL/auth/login"
          curl -sf -o /dev/null -w "Manifest: %{http_code}\n" "$NEXTAUTH_URL/manifest.webmanifest"
          echo "✓ All smoke tests passed"

      - name: Notify Slack on failure
        if: failure() && needs.preflight.outputs.slack == 'true'
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          # `webhook` + `webhook-type` WAJIB: action v4 hanya membaca
          # process.env.SLACK_WEBHOOK_URL kalau input `webhook` kosong, dan
          # menolak jalan tanpa `webhook-type` — sebelumnya kedua input ini
          # tidak diisi sehingga notifikasi tidak pernah terkirim.
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 AniChin ${{ env.ENVIRONMENT }} deploy failed!\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.event.head_commit.message }}",
              "username": "AniChin CI",
              "icon_emoji": ":rotating_light:"
            }

      - name: Notify Slack on success
        if: success() && needs.preflight.outputs.slack == 'true'
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ AniChin ${{ env.ENVIRONMENT }} deploy successful!\nCommit: ${{ github.event.head_commit.id }}\nAuthor: ${{ github.event.head_commit.author.name }}",
              "username": "AniChin CI",
              "icon_emoji": ":tada:"
            }
