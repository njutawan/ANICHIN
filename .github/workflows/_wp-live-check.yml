# SEMENTARA — probe pasif tambahan (dihapus setelah dibaca)
name: _wp-live-check

on:
  push:
    paths:
      - '.github/workflows/_wp-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-probe2:
    name: wp-probe2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1 — TLS, robots, feed, sitemap
        run: |
          set +e
          U=https://anichin.id
          n() { printf '::warning title=%s::%s\n' "$1" "${2:-TIDAK-ADA}"; }
          n "d1-tls-cert" "$(echo | timeout 20 openssl s_client -connect anichin.id:443 -servername anichin.id 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null | tr '\n' ' ' | cut -c1-260)"
          n "d2-tls-protokol" "$(echo | timeout 20 openssl s_client -connect anichin.id:443 -servername anichin.id 2>/dev/null | grep -Eo 'Protocol *: *[A-Za-z0-9.]+' | head -1)"
          curl -sS -m 20 -D /tmp/h -o /dev/null "$U/" 2>/dev/null
          n "d3-alt-svc" "$(grep -i '^alt-svc' /tmp/h | tr -d '\r' | cut -c1-160)"
          n "d4-robots" "$(curl -sS -m 20 "$U/robots.txt" 2>/dev/null | tr '\n' ' ' | cut -c1-240)"
          n "d5-sitemap-target" "$(curl -sS -m 20 -o /dev/null -w '%{http_code} -> %{redirect_url}' "$U/wp-sitemap.xml" 2>&1 | cut -c1-200)"
          n "d6-sitemap2" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "$U/sitemap_index.xml" 2>&1 | cut -c1-40)"
          n "d7-feed" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "$U/feed/" 2>&1 | cut -c1-40)"
          n "d8-header-wp-json" "$(curl -sS -m 20 -D - -o /dev/null "$U/wp-json/" 2>/dev/null | grep -iE '^(x-robots-tag|access-control-allow-origin|cache-control|content-type)' | tr -d '\r' | tr '\n' ' | ' | cut -c1-240)"
          n "d9-namespaces" "$(curl -sS -m 20 "$U/wp-json/" 2>/dev/null | grep -o '\"namespaces\":\[[^]]*\]' | cut -c1-300)"

      - name: 2 — versi tema/aset + permukaan REST
        run: |
          set +e
          U=https://anichin.id
          n() { printf '::warning title=%s::%s\n' "$1" "${2:-TIDAK-ADA}"; }
          curl -sS -m 25 -o /tmp/home "$U/" 2>/dev/null
          n "e1-ukuran-html" "$(wc -c < /tmp/home 2>/dev/null) byte"
          n "e2-tema" "$(grep -o 'wp-content/themes/[a-z0-9._-]*' /tmp/home | sort -u | head -4 | tr '\n' ',')"
          n "e3-aset-ver" "$(grep -oE 'wp-content/(themes|plugins|wp-includes)/[a-z0-9._/-]+\?ver=[0-9a-zA-Z.-]+' /tmp/home | sed 's/.*?ver=//' | sort -u | head -8 | tr '\n' ',')"
          n "e4-plugin-readme" "$(curl -sS -m 15 -o /tmp/pr -w 'http=%{http_code} ' "$U/wp-content/plugins/optimization-detective/readme.txt" 2>&1 | cut -c1-40)$(grep -io 'Stable tag: *[0-9a-zA-Z.-]*' /tmp/pr 2>/dev/null | head -1)"
          n "e5-posts-rest" "$(curl -sS -m 20 -o /tmp/p -w 'http=%{http_code} jumlah=' "$U/wp-json/wp/v2/posts?per_page=1" 2>&1 | cut -c1-40)$(grep -o '\"id\"' /tmp/p 2>/dev/null | wc -l)"
          n "e6-pages-rest" "$(curl -sS -m 20 -o /tmp/pg -w 'http=%{http_code} jumlah=' "$U/wp-json/wp/v2/pages?per_page=1" 2>&1 | cut -c1-40)$(grep -o '\"id\"' /tmp/pg 2>/dev/null | wc -l)"
          n "e7-wp-json-users-roles" "$(curl -sS -m 20 "$U/wp-json/wp/v2/users" 2>/dev/null | grep -o '\"name\":\"[^\"]*\"' | head -3 | tr '\n' ',')"
          n "e8-admin-ajax" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "$U/wp-admin/admin-ajax.php" 2>&1 | cut -c1-40)"
          n "e9-xmlrpc-post" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' -X POST -d '<methodCall><methodName>system.listMethods</methodName></methodCall>' "$U/xmlrpc.php" 2>&1 | cut -c1-40)"

      - name: 3 — subdomain & permukaan lain
        run: |
          set +e
          n() { printf '::warning title=%s::%s\n' "$1" "${2:-TIDAK-ADA}"; }
          for h in staging.anichin.id www.anichin.id; do
            n "f-$h" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code} ip=%{remote_ip} redirect=%{redirect_url} tls=%{ssl_verify_result}' "https://$h/" 2>&1 | cut -c1-200)"
          done
          n "f-www-redirect" "$(curl -sS -m 20 -o /dev/null -w '%{http_code} -> %{redirect_url}' http://www.anichin.id/ 2>&1 | cut -c1-160)"
          n "f-wp-json-users-headers" "$(curl -sS -m 20 -D - -o /dev/null "https://anichin.id/wp-json/wp/v2/users" 2>/dev/null | grep -iE '^(cache-control|x-robots-tag|link|allow)' | tr -d '\r' | tr '\n' ' | ' | cut -c1-240)"
          n "f-login-alternatif" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "https://anichin.id/login" 2>&1 | cut -c1-40)"
          n "f-wp-signup" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "https://anichin.id/wp-signup.php" 2>&1 | cut -c1-40)"
          n "f-csp-report" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "https://anichin.id/wp-content/" 2>&1 | cut -c1-40)"
          n "f-beranda-cache" "$(curl -sS -m 20 -D - -o /dev/null "https://anichin.id/" 2>/dev/null | grep -iE '^(cache-control|cf-cache-status|age|vary)' | tr -d '\r' | tr '\n' ' | ' | cut -c1-200)"
