# SEMENTARA — probe pasif terakhir (dihapus setelah dibaca)
name: _wp-live-check

on:
  push:
    paths:
      - '.github/workflows/_wp-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-probe3:
    name: wp-probe3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1 — email/DNS hygiene (via DoH)
        run: |
          set +e
          n() { printf '::warning title=%s::%s\n' "$1" "${2:-TIDAK-ADA}"; }
          doh() {
            for t in "$2"; do
              r=$(curl -sS -m 15 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$1&type=$t" 2>/dev/null | jq -r '[.Answer[]? | .data] | join(" ; ")')
              n "$3-$t" "${r:0:400}"
            done
          }
          doh "anichin.id" "TXT" "g1-spf"
          doh "_dmarc.anichin.id" "TXT" "g2-dmarc"
          doh "anichin.id" "MX" "g3-mx"
          doh "anichin.id" "CAA" "g4-caa"
          doh "anichin.id" "NS" "g5-ns"
          doh "anichin.id" "A" "g6-a"
          doh "staging.anichin.id" "A" "g7-staging"
          doh "www.anichin.id" "A" "g8-www"

      - name: 2 — listing, robots, cookie, sisa endpoint
        run: |
          set +e
          U=https://anichin.id
          n() { printf '::warning title=%s::%s\n' "$1" "${2:-TIDAK-ADA}"; }
          n "h1-wp-content-body" "$(curl -sS -m 20 "$U/wp-content/" 2>/dev/null | grep -io 'index of[^<]*' | head -1)"
          n "h2-wp-content-body-head" "$(curl -sS -m 20 "$U/wp-content/" 2>/dev/null | head -c 120 | tr '\n' ' ')"
          n "h3-robots-exact" "$(curl -sS -m 20 "$U/robots.txt" 2>/dev/null | base64 -w0 | cut -c1-300)"
          n "h4-users-full" "$(curl -sS -m 20 "$U/wp-json/wp/v2/users" 2>/dev/null | head -c 260)"
          n "h5-login-redirect" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code} -> %{redirect_url}' "$U/login" 2>&1 | cut -c1-160)"
          n "h6-wp-admin" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code} -> %{redirect_url}' "$U/wp-admin/" 2>&1 | cut -c1-160)"
          n "h7-uploads-test" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code}' "$U/wp-content/uploads/2026/07/" 2>&1 | cut -c1-40)"
          n "h8-server-header-login" "$(curl -sS -m 20 -D - -o /dev/null "$U/wp-login.php" 2>/dev/null | grep -iE '^(server|cf-mitigated|cf-ray|x-frame-options|content-type)' | tr -d '\r' | tr '\n' ' | ' | cut -c1-200)"
          n "h9-xmlrpc-405" "$(curl -sS -m 20 -o /dev/null -w 'http=%{http_code} allow=%{header_json}' "$U/xmlrpc.php" 2>/dev/null | head -c 60)"
