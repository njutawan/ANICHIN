# ============================================================================
# SEMENTARA — probe pasif situs WordPress (anichin.id)
# Atas permintaan pemilik situs: hanya GET/HEAD ke URL publik, tanpa fuzzing,
# tanpa brute force, tanpa payload. File ini DIHAPUS setelah hasilnya dibaca.
#
# Catatan: GitHub membatasi jumlah anotasi per step, jadi hasil dikumpulkan ke
# satu berkas lalu dikirim sebagai beberapa anotasi besar.
# ============================================================================
name: _wp-live-check

on:
  push:
    paths:
      - '.github/workflows/_wp-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-probe:
    name: wp-probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe pasif anichin.id
        run: |
          set +e
          U=https://anichin.id
          R=/tmp/report.txt
          : > "$R"
          add() { printf '%s\n' "$*" >> "$R"; }

          add "== ROOT =="
          add "status: $(curl -sS -m 20 -o /dev/null -w '%{http_code} http=%{http_version} redirect=%{redirect_url} tls_verify=%{ssl_verify_result}' "$U/")"
          curl -sS -m 20 -D /tmp/h -o /tmp/home "$U/" 2>/dev/null
          add "-- headers --"
          tr -d '\r' < /tmp/h | sed -n '1,40p' >> "$R"
          add "-- cookie root --"
          grep -i '^set-cookie' /tmp/h | tr -d '\r' | cut -c1-200 >> "$R"

          add ""
          add "== HTTP→HTTPS =="
          add "$(curl -sS -m 20 -o /dev/null -w '%{http_code} -> %{redirect_url}' http://anichin.id/)"

          add ""
          add "== REST API / ENUMERASI =="
          add "wp-json status: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$U/wp-json/")"
          add "wp-json/wp/v2/users: $(curl -sS -m 20 -o /tmp/users -w '%{http_code}' "$U/wp-json/wp/v2/users") jumlah_slug=$(grep -o '"slug"' /tmp/users | wc -l)"
          add "?author=1: $(curl -sS -m 20 -o /dev/null -w '%{http_code} -> %{redirect_url}' "$U/?author=1")"
          add "rest users route (alt): $(curl -sS -m 20 -o /tmp/users2 -w '%{http_code}' "$U/?rest_route=/wp/v2/users") jumlah_slug=$(grep -o '"slug"' /tmp/users2 | wc -l)"

          add ""
          add "== ENDPOINT KLASIK =="
          add "xmlrpc.php: $(curl -sS -m 20 -o /tmp/x -w '%{http_code}' "$U/xmlrpc.php") | $(head -c 90 /tmp/x | tr '\n' ' ')"
          add "readme.html: $(curl -sS -m 20 -o /tmp/r -w '%{http_code}' "$U/readme.html") | $(grep -io 'Version [0-9.]*' /tmp/r | head -1)"
          add "wp-login.php: $(curl -sS -m 20 -o /tmp/l -w '%{http_code}' "$U/wp-login.php") | register: $(grep -ci 'wp-login.php?action=register' /tmp/l)"
          add "wp-login cookie: $(grep -i '^set-cookie' /tmp/l | head -1 | tr -d '\r' | cut -c1-160)"
          add "wp-content/uploads/: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$U/wp-content/uploads/")"
          add "wp-sitemap.xml: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$U/wp-sitemap.xml")"
          add "wp-cron.php: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$U/wp-cron.php")"
          add "robots.txt: $(curl -sS -m 20 "$U/robots.txt" | head -c 160 | tr '\n' ' ')"

          add ""
          add "== BERKAS SENSITIF (harus 404) =="
          for p in /.env /wp-config.php.bak /wp-config.php~ /.git/config /backup.zip /wp-content/debug.log /.well-known/security.txt /xmlrpc.php?rsd; do
            add "$p: $(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$U$p")"
          done

          add ""
          add "== VERSI YANG TEREKSPOS =="
          add "generator: $(grep -io '<meta name=\"generator\" content=\"[^\"]*\"' /tmp/home | head -1)"
          add "plugins: $(grep -o 'wp-content/plugins/[a-z0-9._-]*' /tmp/home | sort -u | head -8 | tr '\n' ',')"
          add "tema: $(grep -o 'wp-content/themes/[a-z0-9._-]*' /tmp/home | sort -u | head -3 | tr '\n' ',')"
          add "aset?ver=: $(grep -o 'ver=[0-9][0-9.]*' /tmp/home | sort -u | head -8 | tr '\n' ',')"
          add "wp-includes?ver: $(grep -o 'wp-includes/[a-z.-]*?ver=[0-9.]*' /tmp/home | sort -u | head -5 | tr '\n' ',')"
          add "security.txt: $(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$U/.well-known/security.txt")"

          add ""
          add "== TLS =="
          add "$(echo | timeout 20 openssl s_client -connect anichin.id:443 -servername anichin.id 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null | tr '\n' ' ')"
          add "http3 alt-svc: $(grep -i '^alt-svc' /tmp/h | tr -d '\r' || echo TIDAK-ADA)"

          # ── kirim sebagai beberapa anotasi besar (batas 10/step) ─────────
          esc() { sed 's/%/%25/g; s/\r//g' "$1" | awk '{printf "%s%%0A", $0}'; }
          total=$(wc -l < "$R")
          for i in 1 2 3 4 5; do
            from=$(( (i-1)*22 + 1 )); to=$(( i*22 ))
            chunk=$(sed -n "${from},${to}p" "$R")
            [ -z "$chunk" ] && continue
            msg=$(printf '%s\n' "$chunk" | esc)
            echo "::warning title=wp $i/5 (baris $from-$to dari $total)::$msg"
          done
          echo "SELESAI ($total baris)"
