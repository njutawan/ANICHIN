# ============================================================================
# AniChin — CI Pipeline
# Triggered on: push (main/develop), PR to main
# Jobs: quality (lint+type) → build → security scan → test → e2e → docker build
#
# NOTE: the Prisma schema is provider="postgresql", so every job that talks to
# the database spins up a real PostgreSQL service (SQLite URLs silently break
# `prisma generate/push`).
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared across jobs — service container above.
  CI_DATABASE_URL: "postgresql://anichin:ci-postgres-runtime-password-2026-for-tests-42chars@localhost:5432/anichin?schema=public"
  CI_NEXTAUTH_SECRET: "ci-test-secret-not-for-production-32chars"
  CI_NEXTAUTH_URL: "http://localhost:3000"

# Hardening repo publik: token default hanya perlu membaca repo. Job yang
# butuh lebih (CodeQL → security-events: write) menimpanya di level job.
permissions:
  contents: read

jobs:
  # ── Job 1: Quality gates (lint + type-check) ──────────────
  quality:
    name: 🧹 Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Run ESLint
        run: bun run lint

      - name: Type-check (tsc)
        run: bunx tsc --noEmit

  # ── Job 2: Unit tests ─────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: ci-postgres-runtime-password-2026-for-tests-42chars
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema (CI PostgreSQL)
        run: bun run db:push
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Run tests (+ coverage threshold)
        # `test:coverage` menjalankan suite yang sama sekaligus menegakkan
        # threshold di vitest.config.ts dan menghasilkan `coverage/` untuk
        # artefak di langkah berikutnya (sebelumnya folder itu selalu kosong).
        run: bun run test:coverage
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.CI_NEXTAUTH_URL }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 3: Production build ────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: ci-postgres-runtime-password-2026-for-tests-42chars
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema (CI PostgreSQL)
        run: bun run db:push
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Build Next.js
        run: bun run build
        env:
          # Standalone output is required by the smoke test + artifact below.
          DEPLOY_TARGET: standalone
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.CI_NEXTAUTH_URL }}

      - name: Smoke-test standalone server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://anichin.id
          TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SMTP_HOST: smtp.test.invalid
          SMTP_USER: ci-mailer@test.invalid
          SMTP_PASS: ci-mailer-secret-for-runtime-smoke-test-2026
        run: |
          # Start the standalone server in background
          node .next/standalone/server.js &
          SERVER_PID=$!
          sleep 8
          # Check it responds (health returns 503 unless the DB is reachable)
          curl -sf http://localhost:3000/api/health | grep -q '"status"'
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-build-${{ github.sha }}
          path: .next/standalone
          retention-days: 7

  # ── Job 4: Security audit ─────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Audit seluruh graph, termasuk dependency dev. eslint-config-next saat ini
      # sengaja tidak dipakai: chain-nya membawa braces@3.0.3 tanpa patch upstream;
      # konfigurasi React/hooks/a11y/TypeScript tetap ada di eslint.config.mjs.
      - name: Run bun audit (blocking)
        run: bun audit

      - name: CodeQL security scan
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
        continue-on-error: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true

  # ── Job 6: E2E (Playwright) ────────────────────────────────
  # Build produksi + browser sungguhan terhadap PostgreSQL yang sudah di-seed.
  # Menutup celah "belum ada test E2E" (P1-11/P2).
  e2e:
    name: 🎭 E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: ci-postgres-runtime-password-2026-for-tests-42chars
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema + seed
        run: |
          bun run db:push
          bun run seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bunx playwright test
        env:
          # Alur komentar lintas pengguna butuh data (lihat e2e/comments.spec.ts).
          E2E_WITH_DB: '1'
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 5: Docker build + RUNTIME smoke test ──────────────
  #
  # Sebelumnya job ini hanya `docker build` lalu `ls /app/server.js`: image
  # yang lolos belum tentu bisa MELAYANI request. Dua kelas bug lolos lewat
  # celah itu dan baru muncul saat deploy:
  #   1. Prisma query engine tidak ikut ke output standalone
  #      → "Prisma Client could not locate the Query Engine for runtime ..."
  #   2. libssl hilang di image runtime (Alpine tidak menyertakan OpenSSL)
  #      → engine musl tidak bisa dimuat
  # Job ini sekarang menjalankan image yang sama seperti yang di-deploy
  # (network host + Postgres service): jalankan migrasi dengan image `migrate`,
  # boot image `web`, lalu pastikan /api/health, halaman depan, dan image
  # optimizer benar-benar merespons.
  docker-build:
    name: 🐳 Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, test]
    # Verify the secret-free Docker build on PRs too, before changes reach main.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-backup-restore-password-32chars-long
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dipakai container (network host) → host runner memakai localhost.
      SMOKE_DB_PASSWORD: ci-backup-restore-password-32chars-long
      SMOKE_DATABASE_URL: postgresql://ci:ci-backup-restore-password-32chars-long@localhost:5432/ci?schema=public
      SMOKE_NEXTAUTH_SECRET: 7f3a0e9c42b8d16f7a50c3e29b614d8f5e2a9c47b1d6038f4a7e5c2d9b0163af
      SMOKE_TFA_KEY: 6a2c8e1f4d7b9035a6c1e8f247b9d05c3a6e1f8d4b7c9025a3e6d1f847b9c05a
      SMOKE_SMTP_PASS: ci-mailer-test-credential-6a8b9c2d
      SMOKE_IMAGE: anichin:ci-${{ github.sha }}
      SMOKE_MIGRATE_IMAGE: anichin:ci-migrate-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Test private backup and disposable restore scripts
        env:
          PGPASSWORD: ${{ env.SMOKE_DB_PASSWORD }}
        run: |
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=ci -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/scripts/test-backup-restore.sh:/tmp/test-backup-restore.sh:ro" \
            -v "$PWD/scripts/backup-db.sh:/tmp/backup-db.sh:ro" \
            -v "$PWD/scripts/restore-db.sh:/tmp/restore-db.sh:ro" \
            postgres:16-alpine sh /tmp/test-backup-restore.sh /tmp/restore-db.sh /tmp/backup-db.sh

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image (PostgreSQL target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          # The next step runs this image; Buildx otherwise only caches it.
          load: true
          tags: anichin:ci-${{ github.sha }}
          build-args: |
            DATABASE_PROVIDER=postgresql
            DATABASE_URL=postgresql://ci:ci-backup-restore-password-32chars-long@localhost:5432/ci?schema=public
          cache-from: type=local,src=/tmp/.docker-cache
          cache-to: type=local,dest=/tmp/.docker-cache,mode=max

      - name: Build image migrate target (Prisma CLI, untuk migrasi)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: false
          load: true
          tags: anichin:ci-migrate-${{ github.sha }}
          build-args: |
            DATABASE_PROVIDER: postgresql
          # Layer `deps`/`builder` sudah dari build di atas → hampir gratis.
          cache-from: type=local,src=/tmp/.docker-cache

      - name: Verify image has correct binaries
        run: |
          docker run --rm "$SMOKE_IMAGE" sh -c "ls -la /app/server.js && node --version"
          # Prisma query engine WAJIB ada di image (kalau tidak, request pertama
          # ke DB akan gagal dengan PrismaClientInitializationError).
          docker run --rm --entrypoint sh "$SMOKE_IMAGE" -c \
            "ls -l /app/node_modules/.prisma/client/ | grep libquery_engine"

      - name: Run Prisma migrations with the migrate image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NODE_ENV=production \
            "$SMOKE_MIGRATE_IMAGE" bunx prisma migrate deploy

      - name: Boot web image and verify it actually serves requests
        run: |
          set -euo pipefail
          docker rm -f anichin-smoke >/dev/null 2>&1 || true
          docker run -d --name anichin-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NEXTAUTH_URL="https://anichin.id" \
            -e NEXTAUTH_SECRET="$SMOKE_NEXTAUTH_SECRET" \
            -e TWO_FACTOR_ENCRYPTION_KEY="$SMOKE_TFA_KEY" \
            -e SMTP_HOST="smtp.test.invalid" \
            -e SMTP_USER="ci-mailer@test.invalid" \
            -e SMTP_PASS="$SMOKE_SMTP_PASS" \
            "$SMOKE_IMAGE"

          echo "⏳ Menunggu /api/health…"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              ok=1; echo "✓ /api/health status=ok (percobaan $i)"; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "✗ Server tidak pernah melaporkan status ok"
            docker logs --tail 80 anichin-smoke || true
            exit 1
          fi

          echo "▶ Cek halaman & endpoint lain…"
          curl -fsS -o /dev/null -w "Home: %{http_code}\n" http://localhost:3000/
          curl -fsS http://localhost:3000/api/auth/providers | grep -q '"credentials"'
          echo "✓ Auth providers OK"
          # Image optimizer (next/image + sharp) — ini yang gagal kalau
          # binary sharp tidak ikut ke output standalone.
          curl -fsS -o /dev/null -w "Image optimizer: %{http_code}\n" \
            "http://localhost:3000/_next/image?url=%2Ficon-192.png&w=64&q=75"
          echo "✓ Runtime smoke test lulus"

      - name: Container logs (selalu, untuk diagnosa)
        if: always()
        run: docker logs anichin-smoke 2>&1 | tail -40 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f anichin-smoke >/dev/null 2>&1 || true
