# ============================================================================
# AniChin — CI Pipeline
# Triggered on: push (main/develop), PR to main
# Jobs: quality (lint+type) → build → security scan → test → docker build
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Quality gates (lint + type-check) ──────────────
  quality:
    name: 🧹 Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Run ESLint
        run: bun run lint

      - name: Type-check (tsc)
        run: bunx tsc --noEmit

  # ── Job 2: Unit tests ─────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Push DB schema (CI SQLite)
        run: bun run db:push
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: "file:./ci.db"
          NEXTAUTH_SECRET: "ci-test-secret-not-for-production-32chars"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 3: Production build ────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Push DB schema (CI SQLite)
        run: bun run db:push
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:./ci.db"
          NEXTAUTH_SECRET: "ci-test-secret-not-for-production-32chars"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Smoke-test standalone server
        run: |
          # Start the standalone server in background
          node .next/standalone/server.js &
          SERVER_PID=$!
          sleep 5
          # Check it responds
          curl -sf http://localhost:3000/api/health | grep -q '"status"'
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-${{ github.sha }}
          path: .next/standalone
          retention-days: 7

  # ── Job 4: Security audit ─────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun audit --production
        continue-on-error: true

      - name: CodeQL security scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
        continue-on-error: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # ── Job 5: Docker build (verify image builds) ─────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image (PostgreSQL target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: anichin:ci-${{ github.sha }}
          build-args: |
            DATABASE_PROVIDER=postgresql
            DATABASE_URL=postgresql://ci:ci@localhost:5432/ci?schema=public
          cache-from: type=local,src=/tmp/.docker-cache
          cache-to: type=local,dest=/tmp/.docker-cache,mode=max

      - name: Verify image has correct binaries
        run: |
          docker run --rm anichin:ci-${{ github.sha }} sh -c "ls -la /app/server.js && node --version"
