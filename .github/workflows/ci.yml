# ============================================================================
# AniChin — CI Pipeline
# Triggered on: push (main/develop), PR to main
# Jobs: quality (lint+type) → build → security scan → test → e2e → docker build
#
# NOTE: the Prisma schema is provider="postgresql", so every job that talks to
# the database spins up a real PostgreSQL service (SQLite URLs silently break
# `prisma generate/push`).
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared across jobs — service container above.
  CI_DATABASE_URL: "postgresql://anichin:anichin@localhost:5432/anichin?schema=public"
  CI_NEXTAUTH_SECRET: "ci-test-secret-not-for-production-32chars"
  CI_NEXTAUTH_URL: "http://localhost:3000"

jobs:
  # ── Job 1: Quality gates (lint + type-check) ──────────────
  quality:
    name: 🧹 Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Run ESLint
        run: bun run lint

      - name: Type-check (tsc)
        run: bunx tsc --noEmit

  # ── Job 2: Unit tests ─────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: anichin
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema (CI PostgreSQL)
        run: bun run db:push
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Run tests (+ coverage threshold)
        # `test:coverage` menjalankan suite yang sama sekaligus menegakkan
        # threshold di vitest.config.ts dan menghasilkan `coverage/` untuk
        # artefak di langkah berikutnya (sebelumnya folder itu selalu kosong).
        run: bun run test:coverage
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.CI_NEXTAUTH_URL }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 3: Production build ────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: anichin
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema (CI PostgreSQL)
        run: bun run db:push
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Build Next.js
        run: bun run build
        env:
          # Standalone output is required by the smoke test + artifact below.
          DEPLOY_TARGET: standalone
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.CI_NEXTAUTH_URL }}

      - name: Smoke-test standalone server
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.CI_NEXTAUTH_URL }}
        run: |
          # Start the standalone server in background
          node .next/standalone/server.js &
          SERVER_PID=$!
          sleep 8
          # Check it responds (health returns 503 unless the DB is reachable)
          curl -sf http://localhost:3000/api/health | grep -q '"status"'
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-build-${{ github.sha }}
          path: .next/standalone
          retention-days: 7

  # ── Job 4: Security audit ─────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate nyata: sebelumnya `continue-on-error: true` membuat advisory
      # high di dependensi produksi (mis. nodemailer) tidak pernah memblokir CI.
      # Kalau ada advisory baru di dependensi produksi, job ini gagal.
      - name: Run bun audit (blocking)
        run: bun audit --production

      - name: CodeQL security scan
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
        continue-on-error: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  # ── Job 6: E2E (Playwright) ────────────────────────────────
  # Build produksi + browser sungguhan terhadap PostgreSQL yang sudah di-seed.
  # Menutup celah "belum ada test E2E" (P1-11/P2).
  e2e:
    name: 🎭 E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anichin
          POSTGRES_PASSWORD: anichin
          POSTGRES_DB: anichin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anichin -d anichin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Push DB schema + seed
        run: |
          bun run db:push
          bun run seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bunx playwright test
        env:
          # Alur komentar lintas pengguna butuh data (lihat e2e/comments.spec.ts).
          E2E_WITH_DB: '1'
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.CI_NEXTAUTH_SECRET }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 5: Docker build (verify image builds) ─────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, test]
    # Verify the secret-free Docker build on PRs too, before changes reach main.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image (PostgreSQL target)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          # The next step runs this image; Buildx otherwise only caches it.
          load: true
          tags: anichin:ci-${{ github.sha }}
          build-args: |
            DATABASE_PROVIDER=postgresql
            DATABASE_URL=postgresql://ci:ci@localhost:5432/ci?schema=public
          cache-from: type=local,src=/tmp/.docker-cache
          cache-to: type=local,dest=/tmp/.docker-cache,mode=max

      - name: Verify image has correct binaries
        run: |
          docker run --rm anichin:ci-${{ github.sha }} sh -c "ls -la /app/server.js && node --version"
